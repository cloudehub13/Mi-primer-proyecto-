# Publicación del catálogo. La carpeta ya es estática: no hay nada que compilar.
[build]
  publish = "."
  command = ""

# Las fotos y las fichas nunca cambian de nombre sin cambiar de contenido,
# así que el navegador puede guardarlas un año y no volver a pedirlas.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fichas/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El catálogo y sus datos sí cambian: se revalidan en cada visita.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/datos.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
